name: Auto Crawl DVCQG Data

on:
  schedule:
    # Chạy tự động vào 22:00 (giờ Việt Nam) tức 15:00 giờ UTC mỗi ngày
    - cron: '0 15 * * *' 
  workflow_dispatch: # Cho phép anh bấm nút chạy thủ công bất cứ lúc nào
  push:
    branches: [ main ]

jobs:
  crawl-and-deploy:
    runs-on: windows-latest
    
    steps:
      - name: Bước 1 - Kéo mã nguồn về máy ảo
        uses: actions/checkout@v3

      - name: Bước 2 - Cài đặt môi trường Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Bước 3 - Cài đặt thư viện
        run: npm install axios dotenv

      - name: Bước 4 - Chạy cỗ máy cào dữ liệu
        run: node tthc_crawler.js
        env:
          GITHUB_ACTIONS: true # Kích hoạt cờ tự động quét 100% trong code JS

      - name: Bước 4.1 - Phân tích & Cảnh báo biến động TTHC (Compare Engine)
        run: |
          node scripts/compare.js
          node scripts/compare_Province.js
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_KEY: ${{ secrets.GAS_SECRET_KEY }}

      - name: Bước 5 - Đẩy dữ liệu ra CDN (ÉP ĐỀ KHÔNG LƯU LỊCH SỬ)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: data # Xuất ra một nhánh riêng tên là "data"
          force_orphan: true   # ĐÂY LÀ TÍNH NĂNG XÓA SỔ LỊCH SỬ CŨ, NGĂN PHÌNH REPO!
          commit_message: "🚀 Cập nhật Master Data tự động"

  notify:
    name: Gửi thông báo qua Telegram (GAS Webhook)
    needs: [crawl-and-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gửi thông báo qua GAS Webhook
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_KEY: ${{ secrets.GAS_SECRET_KEY }}
          STATUS: ${{ needs.crawl-and-deploy.result }}
        run: |
          if [ -z "$GAS_WEBHOOK_URL" ]; then
            echo "⚠️ GAS_WEBHOOK_URL is not set. Skipping Telegram notification."
            exit 0
          fi

          TIME_VN=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M:%S')

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCESS)"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
            STATUS_TEXT="THẤT BẠI (FAILURE)"
          else
            EMOJI="⚠️"
            STATUS_TEXT="ĐÃ HỦY (CANCELLED)"
          fi

          MESSAGE=$(printf "%s *[Crawler Tất cả Tỉnh / Thành phố]*\n📌 *Trạng thái:* %s\n📂 *Workflow:* \`%s\`\n🏢 *Repository:* [%s](https://github.com/%s)\n⏰ *Thời gian:* %s (Giờ VN)\n👤 *Trigger:* \`%s\` (bởi %s)\n🔗 *Chi tiết:* [Xem log GitHub Action](https://github.com/%s/actions/runs/%s)" \
            "$EMOJI" "$STATUS_TEXT" "${{ github.workflow }}" "${{ github.repository }}" "${{ github.repository }}" "$TIME_VN" "${{ github.event_name }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")

          PAYLOAD=$(jq -n \
            --arg secret_key "$GAS_SECRET_KEY" \
            --arg secret "$GAS_SECRET_KEY" \
            --arg status "$STATUS" \
            --arg status_text "$STATUS_TEXT" \
            --arg workflow "${{ github.workflow }}" \
            --arg repository "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg event_name "${{ github.event_name }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg time "$TIME_VN" \
            --arg message "$MESSAGE" \
            --arg text "$MESSAGE" \
            '{
              secret_key: $secret_key,
              secret: $secret,
              status: $status,
              status_text: $status_text,
              workflow: $workflow,
              repository: $repository,
              actor: $actor,
              event_name: $event_name,
              run_id: $run_id,
              run_url: $run_url,
              time: $time,
              message: $message,
              text: $text
            }')

          echo "📤 Gửi thông báo tới GAS Webhook ($STATUS)..."
          response=$(curl -s -L -X POST "$GAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "📩 Phản hồi từ GAS: $response"




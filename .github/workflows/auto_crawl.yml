name: Auto Crawl DVCQG Data

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          chromium --version

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: node tthc_audit2.js
        env:
          GITHUB_ACTIONS: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Deploy to CDN (data branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: data
          force_orphan: true
          commit_message: "🚀 Cập nhật Master Data TTHC tự động"
